name: Build artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_bundle:
    name: Build desktop bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - id: version
        name: Set artifact version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected desktop version '$base_version'; expected X.Y.Z." >&2
            exit 1
          fi
          echo "version=${base_version}-artifact.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Use example build configuration
        run: cp .env.example .env

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JavaScript bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      - name: Upload JavaScript bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.label }}
    needs: [build_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            runner: macos-15
            cli_archive: false
          - label: macOS x64
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            runner: macos-15-intel
            cli_archive: false
          # Remote hosts download this archive from the release when the desktop connects over SSH.
          - label: Linux x64
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            runner: ubuntu-24.04
            cli_archive: true
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}

  publish_release:
    name: Publish GitHub release
    needs: [build_bundle, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build_bundle.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum t3-*.tar.gz > SHA256SUMS
          gh release create "$TAG" ./* --target "$GITHUB_SHA" --title "$TAG" --notes "Built from $GITHUB_SHA."
